<g id="neural-pulse" aria-hidden="true"><style>#neural-pulse .np-edge{fill:none;stroke:#38bdf8;stroke-width:2;opacity:.45}#neural-pulse .np-signal{fill:none;stroke:#06b6d4;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.14 .86;stroke-dashoffset:1;animation:np-travel 3.6s linear infinite}#neural-pulse .np-signal:nth-of-type(2){animation-delay:-1.2s;animation-duration:4.2s}#neural-pulse .np-signal:nth-of-type(3){animation-delay:-2.4s}#neural-pulse .np-node{fill:#06b6d4;transform-box:fill-box;transform-origin:center;animation:np-pulse 2.8s ease-in-out infinite alternate}#neural-pulse .np-hub{fill:#0f172a;stroke:#22d3ee;stroke-width:3}@keyframes np-travel{0%{stroke-dashoffset:1;opacity:0}15%,85%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes np-pulse{from{opacity:.55;transform:scale(.85)}to{opacity:1;transform:scale(1.15)}}@media (prefers-reduced-motion: reduce){#neural-pulse *{animation:none!important}#neural-pulse .np-signal{opacity:0}}</style><g><path class="np-edge" d="M905 74L968 42"/><path class="np-edge" d="M905 74L1012 110"/><path class="np-edge" d="M968 42L1012 110"/><path class="np-edge" d="M968 42L1078 58"/><path class="np-edge" d="M1012 110L1078 58"/><path class="np-edge" d="M1012 110L1052 146"/><path class="np-edge" d="M1078 58L1134 118"/><path class="np-edge" d="M1078 58L1148 34"/><path class="np-edge" d="M1134 118L1052 146"/></g><g><path class="np-signal" pathLength="1" d="M905 74L1012 110L1078 58L1134 118"/><path class="np-signal" pathLength="1" d="M968 42L1078 58L1148 34"/><path class="np-signal" pathLength="1" d="M905 74L968 42L1012 110L1052 146"/></g><g><circle class="np-node" cx="905" cy="74" r="5" style="animation-delay:0.0s"/><circle class="np-node" cx="968" cy="42" r="5" style="animation-delay:-0.4s"/><circle class="np-node np-hub" cx="1012" cy="110" r="8" style="animation-delay:-0.8s"/><circle class="np-node np-hub" cx="1078" cy="58" r="8" style="animation-delay:-1.2s"/><circle class="np-node" cx="1134" cy="118" r="5" style="ani